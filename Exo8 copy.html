<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Exo 9</title>
</head>
<body>
	<h1>Ex 9</h1>
	<audio-video id="audio-video"  controls>
		<video id="video" width="256" height="144">Flux vidéo non-disponible.</video>
		<source src="http://localhost:8080/stream" type="video/mp4" width="256" height="144">
		<div id="track-info"></div>
		<div id="audio-info">Flux audio non-disponible.</div>
		<source src="http://localhost:8080/stream" type="audio/mp3">
	</audio-video>
	<div>
		<button id="start" type="button">Démarrer</button>
		<button id="stop" type="button" disabled>Arrêter</button>
		<button id="pause" type="button" disabled>Mettre en pause</button>
		<button id="fullscreen" type="button" disabled>Plein écran</button>
		<button id="photo" type="button" disabled>Prendre une photo</button>
	</div>
	<br>
	<div>
		<button id="start-audio" type="button">Démarrer audio</button>
		<button id="stop-audio" type="button" disabled>Arrêter audio</button>
		<button id="pause-audio" type="button" disabled>Mettre en pause audio</button>
	</div>
	<br>
	<div>
		<canvas id="canvas" width="256" height="144"></canvas>
		<button id="download" type="button" disabled>Télécharger la photo</button>
	</div>
	<script type="text/javascript" src="Exo9.js"></script>
</body>
</html>
